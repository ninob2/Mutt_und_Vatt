<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Komoot Touren</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <!-- STARTSEITE: Kategorie-Kacheln -->
  <div id="home-view">
    <header>
      <h1>Mutti und Vati auf großi Reisi</h1>
      <p class="subtitle">Es sei euch gegönnt!!!</p>
    </header>
    <div class="category-grid" id="category-grid">
      <!-- Kacheln werden per JS erzeugt -->
    </div>
  </div>

  <!-- DETAILANSICHT: Karte + Liste einer Kategorie -->
  <div id="detail-view" class="hidden">
    <header class="detail-header">
      <button id="back-btn" class="back-btn">&larr; Zurück</button>
      <h1 id="detail-title"></h1>
    </header>
    <div id="map"></div>
    <div class="tour-list" id="tour-list"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
